[project]
name = "ahli-waris"
version = "0.1.0-beta.3"
description = "Kalkulator pewarisan Islam (faraid) dengan dukungan bahasa Indonesia dan Inggris"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Naylings" }
]
# Pinned exactly, not ranged. Flet checks the Flutter major.minor it was
# released against and refuses to build against anything else, so a range here
# would let a release silently upgrade to a Flutter the CI has not installed.
# This pin and FLUTTER_VERSION in .github/workflows/release.yml must move
# together.
dependencies = [
    "flet==1.0.1"
]

[dependency-groups]
dev = [
    "flet-cli==1.0.1",
    "flet-desktop==1.0.1",
    "flet-web==1.0.1",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]==1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
# org + product become the Android application id (com.faraidflow.ahli-waris)
# and the Windows exe filename. The "com.mycompany" the template ships with
# would put someone else's name in the package id of a published app.
# Brand vs slug convention: human-visible strings are FaraidFlow everywhere
# (window title, About page, company, repo, site). The `ahli-waris` slug is
# technical only (package name, exe filename, Android application id) and must
# not be renamed: the exe name is published in install docs and the
# application id cannot change without breaking updates for installed apps.
org = "com.faraidflow"
product = "ahli-waris"
company = "FaraidFlow"
copyright = "Copyright (C) 2026 FaraidFlow"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

# Dart dependency overrides, merged by flet-cli into the generated Flutter
# project's pubspec (dependencies / dependency_overrides / dev_dependencies).
# Why jni is pinned: pub.dev floating resolution currently pairs
# jni_flutter-1.0.4+1 (whose generated code asserts package:jni ^1.1.0) with
# an older jni 1.0.x held back by another transitive constraint, which fails
# Dart compilation with "generated bindings expect package:jni ^1.1.0, but
# 1.0.x was imported". An override beats every other constraint, so this
# forces the compatible pair. Revisit on a flet/Flutter upgrade or once the
# upstream diamond resolves; keeping the pin is harmless either way.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"
