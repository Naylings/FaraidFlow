name: Release

# Pushing a v* tag publishes a GitHub Release containing an Android APK and a
# Windows build, and deploys the web build to GitHub Pages.
#
# The jobs are deliberately independent: the web deploy does not gate the
# release, so a failure in one does not hold up the other.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

env:
  # Flet 1.0.1 refuses to package against any other Flutter major.minor. It
  # reads the pin from flet.version.flutter_version, so this has to move
  # together with the `flet` requirement in pyproject.toml.
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  apk:
    name: Android APK
    # Pinned, not latest: the ubuntu-latest pointer migrates images without
    # warning (26.04 from Oct 2026), and release builds deserve a frozen
    # image. Revisit deliberately, never by surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Accept Android SDK licences
        run: yes | flutter doctor --android-licenses || true

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -eu
          # `secrets.*` is not usable in a step `if:` condition (the parser
          # rejects the context there), so the presence test lives here in
          # shell, where an absent secret is simply empty. Unsigned contexts
          # exit here and take the debug-signing path in Build.
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "no upload keystore secret; APK will be debug-signed"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/faraidflow-upload.jks
          echo "KEYSTORE_PATH=/tmp/faraidflow-upload.jks" >> "$GITHUB_ENV"

      - name: Validate upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_PATH:-}" ]; then
            echo "no keystore configured; skipping validation (debug build)"
            exit 0
          fi
          # Step 1: can the store be opened at all? A failure here means the
          # store password is wrong OR the base64 round-trip produced a corrupt
          # file (truncated paste is the classic) — Gradle reports both the
          # same way after a 5-minute build, so catch it here in seconds.
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" > /tmp/keytool.log 2>&1; then
            echo "::error::cannot open keystore with ANDROID_KEYSTORE_PASSWORD — either the pasted password is wrong, or ANDROID_KEYSTORE_B64 was truncated/corrupted in copy-paste (re-encode and re-paste it). See docs/android-release-signing.md troubleshooting."
            cat /tmp/keytool.log
            exit 1
          fi
          # Step 2: does the alias exist? (Wrong alias fails differently from a
          # wrong password, so check it separately for a precise message.)
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/keytool.log 2>&1; then
            echo "::error::alias $KEY_ALIAS not found in keystore — ANDROID_KEY_ALIAS does not match (keytool is case-sensitive). Available aliases are listed by running keytool -list locally."
            cat /tmp/keytool.log
            exit 1
          fi
          echo "keystore OK"

      - run: uv sync

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          args=(apk --verbose --split-per-abi -o dist/apk)
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            args+=(--android-signing-key-store "$KEYSTORE_PATH"
              --android-signing-key-store-password "$KEYSTORE_PASSWORD"
              --android-signing-key-alias "$KEY_ALIAS"
              --android-signing-key-password "$KEY_PASSWORD")
          fi
          uv run flet build "${args[@]}"

      - name: Collect
        run: |
          set -eu
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mkdir -p out
          found=0
          for apk in $(find dist/apk -name '*.apk' -type f | sort); do
            base="$(basename "$apk" .apk)"
            stem="${base%-release}"
            stem="${stem%-debug}"
            # Flet names split APKs app-<project>-<abi>-release.apk; strip the
            # app-<project> prefix so the published name is ahli-waris-<ver>-<abi>.
            abi="${stem#app-ahli-waris-}"
            abi="${abi#app-}"
            if [ -z "$abi" ]; then abi="$base"; fi
            cp "$apk" "out/ahli-waris-${ver}-${abi}.apk"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no APK under dist/apk"
            find dist -type f 2>/dev/null | head -n 40
            exit 1
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 30

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The Windows runner image ships Visual Studio 2022. Flutter needs the
      # "Desktop development with C++" workload, and will try to add it itself
      # if it is missing, which is interactive. Fail loudly instead of hanging.
      - name: Check C++ toolchain
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) {
            Write-Error "Visual Studio C++ workload is not installed on this runner"
            exit 1
          }
          "using Visual Studio at $vs"

      - run: uv sync

      - name: Diagnose Flutter Windows
        run: |
          flutter doctor -v
          flutter config --enable-windows-desktop

      - name: Build
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          uv run flet build windows --verbose -o dist/windows

      - name: Collect
        shell: pwsh
        run: |
          # Orientation: where are the megabytes? Top 30 files only, so the
          # thousands of files under site-packages don't flood the log.
          Get-ChildItem -Path dist -Recurse -File |
            Sort-Object Length -Descending | Select-Object -First 30 |
            Format-Table FullName, Length
          # The shippable exe is the built product. Never pick by size: dist
          # also holds pip console-script stubs (flet.exe, httpx.exe, ...) and
          # the old biggest-exe heuristic once shipped a 162KB zip of stubs.
          $product = (Select-String -Path pyproject.toml -Pattern '^product\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $exe = Get-ChildItem -Path dist -Recurse -Filter "$product.exe" -File | Select-Object -First 1
          if (-not $exe) { Write-Error "built product $product.exe not found under dist; see listing above"; exit 1 }
          # The exe needs the DLLs and data beside it to run, so ship the folder
          # as a zip rather than the bare binary.
          $dir = Split-Path $exe.FullName -Parent
          "bundling from: $dir"
          Get-ChildItem -LiteralPath $dir | Format-Table Name, Length
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $zip = "out/ahli-waris-$ver-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          Get-ChildItem out | Format-Table Name, Length
          # A working Flutter desktop bundle is tens of MB (flutter_windows.dll
          # alone is ~30MB). Anything under 10MB is a partial output — fail
          # loudly rather than publish an app that crashes on launch. This
          # fails the windows job (and therefore the release) by design.
          if ((Get-Item $zip).Length -lt 10MB) { Write-Error "bundle implausibly small - refusing to ship; see exe/dir listing above"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip
          retention-days: 30

  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block, so contents:read
    # has to be repeated here or actions/checkout starts failing. The other two
    # are what actions/deploy-pages needs to mint a deployment token.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: uv sync

      - name: Build
        run: uv run flet build web --verbose -o dist/web --base-url "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - uses: actions/deploy-pages@v4
        id: deploy

      - name: Report URL
        run: echo "deployed to ${{ steps.deploy.outputs.page_url }}"

  release:
    name: GitHub Release
    needs: [apk, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ### Android

            Download the APK matching your phone and allow **Install unknown
            apps** for whichever app opened it. Android warns about an unknown
            source the first time; that is expected for a build that does not go
            through Google Play.

            - `ahli-waris-*-arm64-v8a.apk` — virtually all modern phones (2017+).
              Pick this unless you know otherwise.
            - `ahli-waris-*-armeabi-v7a.apk` — older 32-bit devices.
            - `ahli-waris-*-x86_64.apk` — emulators and rare x86 phones.

            Official releases are signed with the FaraidFlow upload key; builds without configured secrets fall back to a debug key (testing and sharing only, not the Play Store).

            ### Windows

            Unzip `ahli-waris-*-windows-x64.zip` and run `ahli-waris.exe`. Windows
            SmartScreen may warn about an unrecognised publisher on first run.

            ### Web

            If a web build was published for this tag it is at
            <https://Naylings.github.io/FaraidFlow/>.

            ### Before you rely on it

            This is a beta. It computes Sunni inheritance rules, but check any
            result against a qualified scholar before using it for a real estate.
